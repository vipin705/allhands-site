<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // GitHub Pages SPA trick for /watch/<token> routes.
    // Redirect to /watch/?t=<token> so watch/index.html loads and can read the token.
    var path = window.location.pathname;
    if (path.indexOf('/watch/') === 0) {
      var token = path.slice('/watch/'.length).replace(/\/$/, '');
      if (token) {
        window.location.replace('/watch/?t=' + encodeURIComponent(token));
      }
    }
  </script>
</head>
<body></body>
</html>
